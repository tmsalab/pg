<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="pglTitle pglDesc">
<title id="pglTitle">pg</title>
<desc id="pglDesc">Hexagonal logo for the R package pg, drawn as the model's graph in plate notation. A large solid rounded plate, standing for each response, has the word pg cut out of its lower right. Outside it on the left an open ring labelled beta, the coefficient being learned, sends a wire into the plate to a double ring for the linear predictor psi, which is computed from beta. From psi two wires leave: one to a small filled square holding a 1, the observed correct response, and one down to the Pólya-Gamma variable omega, drawn as its distribution given psi: a tall orange density, labelled omega ~ PG(1, psi), skewed right, standing on its baseline. There is no wire between omega and the response; given psi they are independent. A faint dot grid rules the open plate.</desc>
